[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hivmind-mlforge"
dynamic = ["version"]
description = "A local toolkit for reproducible tabular supervised machine-learning workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HivMindAI" }]
keywords = ["machine-learning", "reproducibility", "scikit-learn", "tabular-data"]
dependencies = [
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=2.3,<3",
    "numpy>=1.26,<2.5",
    "pandas-stubs>=3.0,<4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scikit-learn-stubs>=0.0.3,<0.1",
]

[project.scripts]
mlforge = "mlforge.cli:main"

[project.urls]
Homepage = "https://github.com/HivMindAI/mlforge"
Repository = "https://github.com/HivMindAI/mlforge"
Documentation = "https://github.com/HivMindAI/mlforge/tree/main/docs"
Issues = "https://github.com/HivMindAI/mlforge/issues"
Roadmap = "https://github.com/HivMindAI/mlforge/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlforge = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "mlforge.__version__"}

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
