name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            label: Python 3.11
          - os: ubuntu-latest
            python-version: "3.12"
            label: Python 3.12
          - os: windows-latest
            python-version: "3.12"
            label: Windows / Python 3.12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Validate source distribution contents
        run: python scripts/check_source_archive.py dist

      - name: Smoke test built wheel on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -m pip check
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

      - name: Smoke test built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .wheel-venv
          $wheel = (Get-ChildItem -Path dist -Filter *.whl -File | Select-Object -First 1).FullName
          & .\.wheel-venv\Scripts\python.exe -m pip install $wheel
          & .\.wheel-venv\Scripts\python.exe -m pip check
          $smokeRoot = Join-Path $env:RUNNER_TEMP "mlforge-wheel-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          Set-Location $smokeRoot
          & "$env:GITHUB_WORKSPACE\.wheel-venv\Scripts\python.exe" `
            "$env:GITHUB_WORKSPACE\scripts\wheel_smoke.py"

  private-deployment:
    name: Private deployment smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --file compose.private.yaml config

      - name: Build private deployment images
        run: docker compose --file compose.private.yaml build

      - name: Start private deployment
        run: docker compose --file compose.private.yaml up --detach

      - name: Wait for browser-facing readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose --file compose.private.yaml logs
          exit 1

      - name: Stop private deployment
        if: always()
        run: docker compose --file compose.private.yaml down --volumes

  web-e2e:
    name: Web golden path
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install API and frontend dependencies
        run: |
          python -m pip install -e ".[web]"
          npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run complete browser workflow
        working-directory: frontend
        run: npm run test:e2e
