name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release tag
        run: python scripts/check_release_tag.py "${{ github.event.release.tag_name }}"

      - name: Install build validation tools
        run: python -m pip install "build>=1.2" "twine>=6.0"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Smoke test the built wheel
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -m pip check
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.release-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hivmind-mlforge
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
